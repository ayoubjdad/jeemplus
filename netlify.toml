# Netlify: clear “Build settings” overrides in the dashboard if present, or this file is ignored.
# Expect: build command `pnpm install && pnpm run build` (or `corepack enable && pnpm install && pnpm run build`), publish `dist`.

[build]
  command = "pnpm run build"
  publish = "dist"

# SofaScore JSON: Node fetch from Netlify/AWS often gets 403 (WAF/TLS fingerprinting); we retry with Impit (Chrome JA3/H2).
# Forward the path after `/sofa-api/` with :splat so the function receives `/.netlify/functions/sofascore-fetch/<suffix>`.
# TheSportsDB is used only as fallback for football day schedules (`sport/football/scheduled-events/DATE`).
[[redirects]]
  force = true
  from = "/sofa-api/*"
  to = "/.netlify/functions/sofascore-fetch/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Native TLS addon for Impit (do not bundle; ship node_modules binaries for Linux Lambda).
[functions]
  external_node_modules = ["impit"]
